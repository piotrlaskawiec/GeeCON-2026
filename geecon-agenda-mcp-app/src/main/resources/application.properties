spring.application.name=geecon-agenda-mcp-app

spring.web.error.whitelabel.enabled=false
spring.cache.cache-names=talks,talks-resource
spring.cache.caffeine.spec=expireAfterAccess=120s

spring.ai.mcp.server.name=geecon-agenda-advisor
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.streamable-http.mcp-endpoint=/

spring.main.banner-mode=off