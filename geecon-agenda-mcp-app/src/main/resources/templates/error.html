<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GeeCON MCP Server - Uncharted Territory</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            position: relative;
            z-index: 2;
        }
        h1 {
            font-size: 6rem;
            margin: 0;
            color: #0d6efd;
        }
        p {
            font-size: 1.5rem;
            margin: 1rem 0;
        }
        .blob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            transform: translate(-50%, -50%);
            z-index: 1;
            opacity: 0.1;
            animation: float 8s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                transform: translate(-50%, -52%) scale(1.05);
            }
        }
    </style>
</head>

</svg>
<div class="container">
    <h1>Uncharted Territory</h1>
    <p>AI will take a closer look at that!</p>
</div>
</body>
</html>
