services:
  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: geecon-a2a-lgtm
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - lgtm-data:/data
      - lgtm-grafana:/var/lib/grafana
      # Provision the GeeCON A2A token-usage dashboard
      - ./grafana/dashboards:/otel-lgtm/grafana/dashboards/geecon:ro
      - ./grafana/provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/geecon.yaml:ro

volumes:
  lgtm-data:
  lgtm-grafana:
