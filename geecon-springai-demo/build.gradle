plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.comsenity.geecon.genai'
version = '1.0-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

ext { springAiVersion = '2.0.0-M5' }

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencies {
    implementation project(':geecon-agenda-extractor')
    implementation 'org.springframework.boot:spring-boot-starter'

    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    // Streamable-HTTP MCP client; matches the protocol our deployed geecon.mcpserver.pl uses.
    implementation 'org.springframework.ai:spring-ai-starter-mcp-client'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

bootJar {
    mainClass = 'com.comsenity.geecon.genai.springaidemo.SpringAiDemo'
}

test { useJUnitPlatform() }
